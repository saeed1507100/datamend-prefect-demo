[project]
name = "datamend-prefect-demo"
version = "0.1.0"
description = "A small Prefect pipeline that datamend watches and repairs."
requires-python = ">=3.12"
dependencies = ["prefect>=3.1,<4", "duckdb>=1.1"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
